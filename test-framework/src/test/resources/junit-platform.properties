# Parallel execution of the test-framework tests.
# Every test owns its emulator session: its own emulator on a free port, its own client
# and its own storage directory (see AbstractApiTest), so the threads share no state.
# Test classes run in parallel; the methods of one class run one after another.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=3
# Without this limit the fork-join pool may start extra threads and run more classes at once
junit.jupiter.execution.parallel.config.fixed.max-pool-size=3
